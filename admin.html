<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>使用数据统计 · 课标词汇教学例句库</title>
<link rel="stylesheet" href="style.css?v=20260812u" />
<style>
  /* ========== 后台专用样式 ========== */
  body { min-height: 100vh; }
  .admin-label {
    display: block; text-align: left;
    font-size: 13px; font-weight: 600; color: var(--muted);
    margin: 12px 0 6px;
  }
  #admin-form input {
    width: 100%; box-sizing: border-box;
    padding: 10px 14px; font-size: 15px;
    color: var(--text); background: var(--bg-2);
    border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  #admin-form input:focus { border-color: var(--subtitle); }
  #admin-login-btn {
    width: 100%; margin-top: 18px; padding: 11px 0;
    font-size: 16px; font-weight: 700; letter-spacing: 4px;
    color: #fff; background: linear-gradient(135deg, var(--subtitle), var(--title));
    border: none; border-radius: 10px; cursor: pointer;
  }
  #admin-login-btn:hover { opacity: 0.9; }
  .admin-actions { display: flex; gap: 8px; align-items: center; }
  .admin-actions button {
    padding: 6px 14px; font-size: 13px; cursor: pointer;
    color: var(--muted); background: var(--card-2);
    border: 1px solid var(--border); border-radius: 999px;
    transition: color .15s, border-color .15s;
  }
  .admin-actions button:hover { color: var(--subtitle); border-color: var(--subtitle); }
  #admin-logout-btn:hover { color: #dc2626; border-color: #dc2626; }
  .admin-main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  .admin-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; margin: 4px 0 16px;
  }
  .admin-toolbar select {
    padding: 7px 12px; font-size: 13.5px; color: var(--text);
    background: var(--card-2); border: 1px solid var(--border); border-radius: 8px;
  }
  .stat-cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px; margin-bottom: 20px;
  }
  .stat-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px;
  }
  .stat-card .num {
    font-size: 30px; font-weight: 800; color: var(--title);
    font-variant-numeric: tabular-nums; line-height: 1.2;
  }
  .stat-card .lbl { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .stat-card.hl { background: linear-gradient(135deg, var(--card), var(--bg-2)); border-color: var(--subtitle); }
  .charts {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;
  }
  .chart-box, .table-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px;
  }
  .chart-box h3, .table-box h3 { font-size: 15px; color: var(--title); margin: 0 0 14px; }
  .chart-box canvas { max-height: 320px; }
  .table-box { overflow-x: auto; }
  table.daily {
    width: 100%; border-collapse: collapse; font-size: 13.5px;
  }
  table.daily th, table.daily td {
    padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  table.daily th:first-child, table.daily td:first-child { text-align: left; }
  table.daily th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  table.daily tr:last-child td { border-bottom: none; }
  .load-tip { text-align: center; color: var(--muted); padding: 40px 0; }
  @media (max-width: 860px) { .charts { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- 访问码保护 -->
<div id="admin-login" class="auth-overlay">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="logo">📊</span>
      <h2>使用数据统计</h2>
      <p class="auth-sub">课标词汇教学例句库 · 课题影响力分析</p>
    </div>
    <form id="admin-form">
      <label class="admin-label" for="admin-pass-input">访问码</label>
      <input id="admin-pass-input" type="password" placeholder="请输入访问码" required autocomplete="off" />
      <button id="admin-login-btn" type="submit">进 入</button>
      <p id="admin-msg" class="auth-msg" hidden></p>
    </form>
    <p class="auth-sub" style="margin-top:16px">仅限课题负责人使用，数据用于结题报告</p>
  </div>
</div>

<!-- 数据面板 -->
<div id="dashboard" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📊</span>
      <div>
        <h1>使用数据统计</h1>
        <p class="sub">课标词汇教学例句库 · 全国用户使用分析</p>
      </div>
    </div>
    <div class="admin-actions">
      <button id="refresh-btn" type="button">↻ 刷新</button>
      <button id="export-btn" type="button">⬇ 导出 CSV</button>
      <button id="admin-logout-btn" type="button">退出</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-toolbar">
      <span class="auth-sub" style="margin:0" id="range-label">统计范围：全部时间</span>
      <select id="range-select">
        <option value="all">全部时间</option>
        <option value="7">最近 7 天</option>
        <option value="30">最近 30 天</option>
        <option value="90">最近 90 天</option>
      </select>
    </div>

    <div class="stat-cards" id="stat-cards"></div>

    <div class="charts">
      <div class="chart-box">
        <h3>每日使用趋势（PV · 独立访客 · 查询次数）</h3>
        <canvas id="trend-chart"></canvas>
      </div>
      <div class="chart-box">
        <h3>热门词汇 TOP 20</h3>
        <canvas id="top-chart"></canvas>
      </div>
    </div>

    <div class="table-box">
      <h3>每日明细</h3>
      <table class="daily" id="daily-table">
        <thead>
          <tr><th>日期</th><th>PV</th><th>独立访客</th><th>查询次数</th><th>人均查询</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="cloudbase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
